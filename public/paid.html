<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Slot unlocked - GC</title>
    <meta name="theme-color" content="#030206" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/legal.css" />
    <style>
      .done-wrap { max-width: 460px; margin: 0 auto; padding: 88px 22px; text-align: center; }
      .tick {
        width: 74px; height: 74px; margin: 0 auto 26px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 34px; color: #34d399;
        background: rgba(52, 211, 153, 0.10);
        border: 2px solid rgba(52, 211, 153, 0.38);
      }
      .done-body { color: var(--text-body); font-size: 16px; margin: 0 0 30px; }
      .cta {
        display: block; width: 100%; box-sizing: border-box;
        padding: 15px 34px; border-radius: 999px;
        background: var(--accent); color: #fff; font-weight: 650;
        font-size: 16px; text-decoration: none;
      }
      .cta:hover { filter: brightness(1.08); }
      /* Secondary route, same footprint so neither reads as the failure case. */
      .cta.secondary {
        background: transparent; color: var(--text-body);
        border: 1px solid var(--hairline, #2b2844);
      }
      .routes { display: flex; flex-direction: column; gap: 12px; }
      .hint { margin-top: 22px; font-size: 14px; color: var(--text-muted); }
    </style>
  </head>
  <body>
    <div class="done-wrap">
      <div class="tick" aria-hidden="true">&#10003;</div>
      <h1 style="font-size: 30px; margin-bottom: 10px">Slot unlocked</h1>

      <!--
        Deliberately does not claim to have granted anything itself. The slot
        is granted by the signed webhook, which may land a moment before or
        after this page loads, so the copy describes the outcome rather than
        promising an instant state the app might not have refreshed into yet.
      -->
      <p class="done-body">
        Your payment went through. You can create one more GC.
      </p>

      <!--
        Both routes are always shown. Which one is right depends on where the
        payment started, and this page cannot tell: checkout opens in an
        external browser, so an app payer and a web payer land here identically.
        Guessing hid the working route from half of them, so neither is hidden.

        The app link uses the `gc` scheme registered in app.json. On a device
        without GC installed the scheme simply does not resolve, which is why
        the web route sits directly beneath it rather than behind a hint.
      -->
      <div class="routes">
        <a class="cta" href="gc://">Back to the GC app</a>
        <a class="cta secondary" href="/">Open GC on the web</a>
      </div>
      <p class="hint">
        Your new slot is already on your account either way.
      </p>
    </div>

  </body>
</html>
