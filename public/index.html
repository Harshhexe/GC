<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>GC</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B0B12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GC" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style id="expo-reset">
      /* Standalone iOS PWA doesn't reliably fill the viewport with plain
         height:100% (Safari's dynamic toolbar), and without an explicit
         background here the status-bar and home-indicator safe-area strips
         fall back to white — that's the gray/white bars around the app. */
      html, body {
        height: 100%;
        width: 100%;
        background-color: #0B0B12;
        margin: 0;
        padding: 0;
      }
      body {
        /* Pinned, not just `overflow: hidden`.
           In a standalone iOS PWA `overflow: hidden` alone does NOT take the
           document out of the scroll chain — WebKit still hands the touch to
           the page first and rubber-bands it, which steals the gesture from
           whatever list is underneath and is what makes scrolling feel stuck
           or half-dead. Pinning the body is what actually removes it, so the
           only thing left that can scroll is the list you're touching. */
        position: fixed;
        inset: 0;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        flex-direction: column;
        height: 100%;
        width: 100%;
        flex: 1;
        background-color: #0B0B12;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
