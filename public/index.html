<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content" />
    <title>GC</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#030206" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GC" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style id="expo-reset">
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      /* Standalone iOS PWA doesn't reliably fill the viewport with plain
         height:100% (Safari's dynamic toolbar), and without an explicit
         background here the status-bar and home-indicator safe-area strips
         fall back to white — that's the gray/white bars around the app. */
      html {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #030206;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-user-select: none;
        user-select: none;
      }
      body {
        height: 100%;
        width: 100%;
        background-color: #030206;
        margin: 0;
        padding: 0;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-user-select: none;
        user-select: none;
      }
      /* Remove browser focus rings / blue rectangles from text inputs and textareas */
      textarea, input {
        resize: none;
        outline: none !important;
        outline-color: transparent !important;
        outline-width: 0 !important;
        box-shadow: none !important;
        -webkit-tap-highlight-color: transparent !important;
        -webkit-user-select: auto !important;
        user-select: auto !important;
      }
      /* The contact/credential glyph Safari injects into a field it thinks is
         autofillable. Belt-and-braces alongside the attribute work in
         ChatScreen — this only hides the button, it does not stop AutoFill. */
      input::-webkit-contacts-auto-fill-button,
      input::-webkit-credentials-auto-fill-button,
      textarea::-webkit-contacts-auto-fill-button {
        visibility: hidden;
        display: none !important;
        pointer-events: none;
        position: absolute;
        right: 0;
      }
      textarea:focus, input:focus {
        outline: none !important;
        outline-color: transparent !important;
        outline-width: 0 !important;
        box-shadow: none !important;
      }
      /* Message bubbles must never swallow a vertical drag.
         react-native-gesture-handler sets its own touch-action here for the
         swipe-to-reply pan, which on iOS means the transcript simply does not
         scroll while your finger is on a bubble — you could only scroll from
         the gaps between them. touch-action is resolved at touchstart, so
         declaring pan-y is what actually keeps the scroll available. */
      [data-gcbubble] {
        touch-action: pan-y !important;
      }
      #root {
        display: flex;
        flex-direction: column;
        /* The app shell is fixed to the complete installed-PWA screen in both
           keyboard states.  Do not tie this box to visualViewport: on iOS the
           visual viewport changes while the keyboard animates and resizing the
           root makes the whole navigator (including the dock) jump.  Chat
           alone reads visualViewport and adds its keyboard inset below its
           composer; the rest of the interface keeps this stable geometry.

           100dvh / 100vw (not inset:0 or height:100%) — on iOS standalone
           PWA, fixed+inset:0 clips to the safe area and leaves a black gap
           at the home indicator.  dvh spans the full physical screen. */
        position: fixed;
        top: 0;
        left: 0;
        height: 100dvh;
        width: 100vw;
        overflow: hidden;
        background-color: #030206;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
