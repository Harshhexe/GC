<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content" />
    <title>GC</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B0B12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GC" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style id="expo-reset">
      /* Standalone iOS PWA doesn't reliably fill the viewport with plain
         height:100% (Safari's dynamic toolbar), and without an explicit
         background here the status-bar and home-indicator safe-area strips
         fall back to white — that's the gray/white bars around the app. */
      html, body {
        height: 100%;
        width: 100%;
        background-color: #0B0B12;
        margin: 0;
        padding: 0;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }
      /* Message bubbles must never swallow a vertical drag.
         react-native-gesture-handler sets its own touch-action here for the
         swipe-to-reply pan, which on iOS means the transcript simply does not
         scroll while your finger is on a bubble — you could only scroll from
         the gaps between them. touch-action is resolved at touchstart, so
         declaring pan-y is what actually keeps the scroll available. */
      [data-gcbubble] {
        touch-action: pan-y !important;
      }
      #root {
        display: flex;
        flex-direction: column;
        /* Driven by visualViewport below so the app ends exactly where the
           keyboard begins; falls back to the full height before that runs. */
        height: var(--gc-app-height, 100%);
        max-height: var(--gc-app-height, 100%);
        width: 100%;
        flex: 1;
        background-color: #0B0B12;
        overflow: hidden;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
