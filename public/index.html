<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>GC</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B0B12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GC" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style id="expo-reset">
      /* Standalone iOS PWA doesn't reliably fill the viewport with plain
         height:100% (Safari's dynamic toolbar), and without an explicit
         background here the status-bar and home-indicator safe-area strips
         fall back to white — that's the gray/white bars around the app. */
      html, body {
        height: 100%;
        height: 100dvh;
        width: 100%;
        background-color: #0B0B12;
        margin: 0;
        padding: 0;
        overscroll-behavior-y: none;
      }
      body {
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        width: 100%;
        flex: 1;
        background-color: #0B0B12;
        overflow: hidden;
      }
      /* Enable smooth hardware momentum touch scrolling for all scroll containers */
      [style*="overflow-y: scroll"],
      [style*="overflow-y: auto"],
      [style*="overflow: auto"],
      [style*="overflow: scroll"],
      .r-overflowX-lltvgl,
      .r-overflowY-1rnoaur {
        -webkit-overflow-scrolling: touch !important;
        touch-action: pan-y !important;
        overscroll-behavior-y: contain;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
